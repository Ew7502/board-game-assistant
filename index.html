<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game AI Assistant</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
    button { background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #f2f2f2; border-radius: 6px; white-space: pre-wrap; }
    img { max-width: 100%; margin-top: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>🎲 Game Strategy Scanner</h2>

  <label><strong>1. Enter Gemini API Key:</strong></label>
  <input type="password" id="apiKey" placeholder="AIzaSy...">

  <label><strong>2. Take a photo of cards/board:</strong></label>
  <input type="file" id="imageInput" accept="image/*" capture="environment">

  <img id="preview" style="display:none;">

  <button onclick="analyzeGame()">Analyze & Suggest Strategy</button>

  <div id="result" style="display:none;"></div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    async function analyzeGame() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const file = imageInput.files[0];
      const resultDiv = document.getElementById('result');

      if (!apiKey) return alert('Please enter your API Key.');
      if (!file) return alert('Please snap or upload a photo.');

      resultDiv.style.display = 'block';
      resultDiv.innerText = 'Scanning pieces, cards, and calculating strategy...';

      // Convert image file to base64
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];

        const prompt = `Look at this photo of a board game state (cards, resources, food, board, etc.). 
1. List what you detect (cards, tokens, current positions).
2. Recommend the best next moves and the winning strategy based on this state. Keep it clear and concise.`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: file.type, data: base64Data } }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            resultDiv.innerText = data.candidates[0].content.parts[0].text;
          } else {
            resultDiv.innerText = 'Error: ' + JSON.stringify(data);
          }
        } catch (err) {
          resultDiv.innerText = 'Network error: ' + err.message;
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
